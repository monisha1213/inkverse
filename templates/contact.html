{% extends "base.html" %}

{% block title %}Contact - InkVerse{% endblock %}

{% block content %}
    <h1>Get in Touch</h1>
    <p>Have feedback, found a bug, or just want to say hello? Reach out below.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('contact') }}">
        <div>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" required>
        </div>
        <br>
        <div>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>
        <div>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <br>
        <button type="submit">Send Message</button>
    </form>

    <p style="margin-top: 24px;">Or reach out directly via <a href="https://github.com/monisha1213" target="_blank" rel="noopener">GitHub</a>.</p>
{% endblock %}
