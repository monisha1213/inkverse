{% extends "base.html" %}

{% block title %}Edit Chapter - {{ story.title }}{% endblock %}

{% block content %}
    <h1>Edit Chapter {{ chapter.chapter_number }}</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_chapter', story_id=story.id, chapter_number=chapter.chapter_number) }}">
        <div>
            <label for="title">Chapter Title</label><br>
            <input type="text" id="title" name="title" value="{{ chapter.title }}" required>
        </div>
        <br>
        <div>
            <label for="content">Chapter Content</label><br>
            <textarea id="content" name="content" rows="15" required>{{ chapter.content }}</textarea>
        </div>
        <br>
        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{{ url_for('read_chapter', story_id=story.id, chapter_number=chapter.chapter_number) }}">&larr; Back to chapter</a></p>
{% endblock %}
