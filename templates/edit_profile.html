{% extends "base.html" %}

{% block title %}Edit Profile - InkVerse{% endblock %}

{% block content %}
    <h1>Edit Your Profile</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_profile') }}">
        <div>
            <label for="bio">Bio</label><br>
            <textarea id="bio" name="bio" rows="4" placeholder="Tell readers a little about yourself...">{{ current_user.bio or '' }}</textarea>
        </div>
        <br>
        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{{ url_for('profile', username=current_user.username) }}">&larr; Back to my profile</a></p>
{% endblock %}
